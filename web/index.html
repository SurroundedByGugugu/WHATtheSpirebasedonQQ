<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <meta name="description" content="私货之塔 · 在浏览器里开始你的单人爬塔旅程。">
  <title>私货之塔 · 单人冒险</title>
  <link rel="stylesheet" href="./style.css">
  <script defer src="./bootstrap.js"></script>
</head>
<body>
  <header class="topbar"><a class="brand" href="./">私货之塔 <span>WHAT THE SPIRE</span></a><span class="edition">浏览器版 / 单人冒险</span><button id="help" data-command="/card help" disabled>指令帮助</button></header>
  <main>
    <section id="loading" class="loading" aria-live="polite"><span class="eyebrow">PREPARING THE RUN</span><h1>高塔正在苏醒</h1><p id="loading-message">正在准备游戏…</p><progress aria-label="加载游戏"></progress><button id="retry" hidden>重新加载</button></section>
    <div id="error" class="error" role="alert" hidden></div>
    <section id="start" hidden>
      <div class="section-heading"><div><span class="eyebrow">CHOOSE YOUR CHARACTER</span><h1>这次，由谁登塔？</h1></div><p>选一位角色，开始新的旅途。<br>熟悉的高塔，和一点点私货。</p></div>
      <div id="characters" class="characters"></div>
      <p class="local-note">游戏在当前标签页内运行。刷新或关闭页面会结束本局。首次载入需要网络。</p>
    </section>
    <section id="game" hidden>
      <div class="run-heading"><div><span id="location" class="eyebrow"></span><h1 id="player-name"></h1></div><button id="new-run">更换角色 / 新一局</button></div>
      <div id="stats" class="stats"></div>
      <div class="workspace">
        <div class="play-area">
          <section class="panel arena"><div class="panel-heading"><h2 id="arena-title">当前节点</h2><span id="turn-label"></span></div><div id="enemies" class="enemies"></div><p id="player-status" class="status-text"></p><div id="node-view" class="node-view"></div><div id="choices" class="choices"></div></section>
          <section id="hand-panel" class="panel"><div class="panel-heading"><h2>你的手牌 <span id="hand-count"></span></h2><button data-command="/card end" class="primary">结束回合</button></div><p class="hint">先点选敌人，再点击手牌出牌。特殊选择可在下方输入指令。</p><div id="hand" class="hand"></div><div id="piles" class="piles"></div></section>
        </div>
        <aside class="panel sidebar"><span class="eyebrow">THIS RUN</span><h2>行囊与旅途</h2><div class="quick-actions"><button data-command="/card route">查看地图</button><button data-command="/card deck">完整牌库</button><button data-command="/card status">状态详情</button><button data-command="/card state">场地 / Zone</button><button data-command="/card reward">当前奖励</button><button data-command="/card view">当前状态</button></div><h3>遗物</h3><div id="relics" class="inventory"></div><h3>药水</h3><div id="potions" class="inventory"></div><p id="boss" class="boss"></p><p class="local-note">本局仅保留在当前标签页。</p></aside>
      </div>
    </section>
    <section id="console" class="panel console" hidden>
      <div class="panel-heading"><h2>冒险记录</h2><span id="connection" role="status">准备就绪</span></div>
      <div id="confirmation" class="confirmation" hidden><span>请查看下方提示，确认是否继续。</span><button data-command="/card yes" class="primary">确认</button><button data-command="/card no">取消</button></div>
      <div id="log" class="log" role="log" aria-live="polite" aria-relevant="additions"></div>
      <div id="command-hints" class="command-hints"></div>
      <form id="command-form"><label for="command">游戏指令</label><div class="command-line"><input id="command" autocomplete="off" spellcheck="false" maxlength="1000" placeholder="例如 /card play 0，或直接输入 play 0"><button type="submit" class="primary">执行</button></div></form>
    </section>
  </main>
  <footer><span>私货之塔</span><span>一张牌，一步路，一点私货。</span></footer>
</body>
</html>
